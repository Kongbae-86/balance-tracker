<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF8F2">
<title>Balance Tracker</title>
<style>
:root {
  --bg:          #FDF8F2;
  --bg2:         #F9F3EA;
  --surface:     #FFFFFF;
  --surface2:    #FDF6EE;
  --border:      #E8DDD0;
  --border2:     #D9CCBA;
  --orange:      #D4570A;
  --orange-dim:  #B84A08;
  --orange-lt:   #FFF0E6;
  --orange-pale: #FDDCC8;
  --orange-glow: rgba(212,87,10,0.12);
  --red:         #C0392B;
  --red-lt:      #FFF0EE;
  --green:       #1A7A3C;
  --green-lt:    #EDF7F1;
  --yellow:      #B45309;
  --yellow-lt:   #FEF9EE;
  --blue:        #1D4ED8;
  --blue-lt:     #EEF2FF;
  --text:        #1C1410;
  --text-dim:    #6B5744;
  --text-muted:  #A8947E;
  --text-faint:  #C9B9A8;
  --shadow:      0 1px 4px rgba(100,60,20,0.08), 0 2px 12px rgba(100,60,20,0.04);
  --shadow-sm:   0 1px 3px rgba(100,60,20,0.07);
  --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --topbar-h: 90px;
  --tabs-h:   42px;
  --filter-h: 44px;
  --hdr-total: 176px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; }

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(253,248,242,0.96);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px; height: var(--topbar-h);
  box-shadow: var(--shadow-sm);
}
.topbar-row { display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; color: var(--orange); }
.topbar-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.hero-bal { font-size: 27px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.hero-bal.pos { color: var(--green); }
.hero-bal.neg { color: var(--red); }
.hero-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.09em; text-align: right; }

/* ── TABS ── */
.tabs-wrap {
  position: sticky; top: var(--topbar-h); z-index: 99;
  background: rgba(253,248,242,0.95);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; scrollbar-width: none; height: var(--tabs-h);
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; padding: 0 15px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-muted); border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s;
  background: none; border-top: none; border-left: none; border-right: none;
  display: flex; align-items: center; gap: 5px;
}
.tab.active { color: var(--orange); border-bottom-color: var(--orange); }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg2); border-radius: 9px;
  min-width: 17px; height: 17px; padding: 0 4px;
  font-size: 10px; color: var(--text-muted); border: 1px solid var(--border);
}
.tab.active .badge { background: var(--orange-lt); border-color: var(--orange-pale); color: var(--orange); }

/* ── FILTER CHIPS ── */
.filter-row {
  position: sticky; top: calc(var(--topbar-h) + var(--tabs-h)); z-index: 98;
  background: rgba(253,248,242,0.93);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 6px; padding: 8px 14px;
  overflow-x: auto; scrollbar-width: none; height: var(--filter-h);
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
  font-size: 11px; font-weight: 600; color: var(--text-dim);
  cursor: pointer; transition: all 0.14s; box-shadow: var(--shadow-sm);
}
.chip.active { background: var(--orange-lt); border-color: var(--orange-pale); color: var(--orange); }

/* ── CONTENT ── */
.content { padding: 0 0 100px; }

/* ── STARTING BALANCE ANCHOR ── */
.start-anchor {
  margin: 10px 12px 2px;
  background: var(--orange-lt);
  border: 1.5px solid var(--orange-pale);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.sa-left .sa-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--orange); }
.sa-left .sa-date  { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.sa-amount { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; color: var(--orange); }

/* ── DATE HEADER ── */
.date-header {
  padding: 14px 16px 5px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-muted);
  position: sticky; top: var(--hdr-total); z-index: 50;
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
}
.date-header.today-hdr { color: var(--orange); }
.dh-bal { font-size: 13px; font-weight: 700; letter-spacing: -0.3px; }
.dh-bal.pos { color: var(--green); }
.dh-bal.neg { color: var(--red); }

/* week-banner removed */

/* ── TX CARD ── */
.tx-card {
  margin: 0 12px 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 13px;
  display: flex; align-items: center; gap: 11px;
  cursor: pointer; transition: background 0.12s, box-shadow 0.12s;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.tx-card.today-card { border-color: var(--orange-pale); }
.tx-card.today-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--orange); }
.tx-card:active { background: var(--bg2); }
.tx-card.dim-card { opacity: 0.42; }

.tx-icon {
  width: 36px; height: 36px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.tx-icon.income   { background: var(--green-lt); }
.tx-icon.credit   { background: var(--red-lt); }
.tx-icon.spending { background: var(--yellow-lt); }

.tx-body { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tx-tag {
  border-radius: 4px; padding: 1px 6px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
}
.tx-tag.income   { background: var(--green-lt);  color: var(--green); }
.tx-tag.credit   { background: var(--red-lt);    color: var(--red); }
.tx-tag.spending { background: var(--yellow-lt); color: var(--yellow); }
.tx-tag.pending  { background: var(--orange-lt); color: var(--orange); }

.tx-right { text-align: right; flex-shrink: 0; }
.tx-amt { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.tx-amt.in      { color: var(--green); }
.tx-amt.out     { color: var(--red); }
.tx-amt.pending { color: var(--orange); font-size: 12px; font-weight: 600; }
.tx-bal-after { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.bval { font-weight: 600; }
.bval.pos { color: var(--green); }
.bval.neg { color: var(--red); }

/* ── SUMMARY BAR ── */
.summary-bar {
  display: flex; margin: 10px 12px 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.sc { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid var(--border); }
.sc:last-child { border-right: none; }
.sc-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }
.sc-val { font-size: 14px; font-weight: 700; margin-top: 2px; letter-spacing: -0.3px; }
.sc-val.pos { color: var(--green); }
.sc-val.neg { color: var(--red); }
.sc-val.org { color: var(--orange); }

/* ── INFO CARD ── */
.info-card {
  margin: 8px 12px 5px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);
}
.info-card-hdr {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 9px;
  background: var(--bg2);
}
.info-card-hdr .ico  { font-size: 20px; }
.info-card-hdr .ttl  { font-size: 14px; font-weight: 700; color: var(--text); }
.info-card-hdr .sub  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.info-row {
  padding: 11px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer;
}
.info-row:last-child { border-bottom: none; }
.info-row:active { background: var(--bg2); }
.info-row .rl { color: var(--text-dim); }
.info-row .rv { font-weight: 700; color: var(--orange); display: flex; align-items: center; gap: 5px; }
.info-row .rv .edit-hint { font-size: 11px; color: var(--text-faint); font-weight: 400; }
.info-note { padding: 9px 14px; font-size: 11px; color: var(--text-muted); background: var(--bg2); }

/* ── CC CARD ── */
.cc-card {
  margin: 0 12px 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow-sm); cursor: pointer;
}
.cc-card:active { background: var(--bg2); }
.cc-card.dim-card { opacity: 0.38; }
.cc-card-hdr {
  padding: 9px 13px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg2);
}
.cc-card-name { font-size: 13px; font-weight: 700; color: var(--text); }
.owner-badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.owner-badge.Justin { background: var(--orange-lt); color: var(--orange); border: 1px solid var(--orange-pale); }
.owner-badge.EJ     { background: var(--blue-lt);   color: var(--blue);   border: 1px solid #BFCFFF; }
.owner-badge.Joint  { background: var(--yellow-lt); color: var(--yellow); border: 1px solid #F5DFA0; }
.cc-card-body { padding: 10px 13px; display: flex; align-items: center; justify-content: space-between; }
.cc-date-lbl  { font-size: 12px; color: var(--text-dim); }
.cc-sub-lbl   { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }
.cc-amt-confirmed { font-size: 18px; font-weight: 800; color: var(--red); letter-spacing: -0.5px; }
.cc-amt-pending   { font-size: 13px; font-weight: 600; color: var(--orange); font-style: italic; }
.cc-bal-line      { font-size: 11px; color: var(--text-muted); margin-top: 3px; text-align: right; }

/* ── LIST ROW ── */
.list-row {
  margin: 0 12px 5px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 14px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; box-shadow: var(--shadow-sm);
}
.list-row:active { background: var(--bg2); }
.lr-name { font-size: 14px; font-weight: 600; color: var(--text); }
.lr-sub  { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* ── TOTAL BANNER ── */
.total-banner {
  margin: 10px 12px 4px;
  padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.tb-lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.tb-val { font-size: 20px; font-weight: 800; letter-spacing: -0.6px; }

.section-lbl { padding: 12px 16px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(28,20,16,0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 22px 22px 0 0;
  border-top: 2px solid var(--orange-pale);
  width: 100%; max-width: 560px;
  padding: 18px 18px 48px; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 -4px 30px rgba(100,60,20,0.15);
}
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 14px; }
.modal-title  { font-size: 18px; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.4px; color: var(--text); }
.modal label  {
  display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600;
}
.modal input, .modal select {
  width: 100%; background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 12px; font-size: 15px;
  color: var(--text); margin-bottom: 12px; font-family: var(--font);
  -webkit-appearance: none; appearance: none;
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--orange); background: #fff; }
.modal-divider { height: 1px; background: var(--border); margin: 6px 0 14px; }
.modal-section { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 10px; }
.modal-btns { display: flex; gap: 8px; margin-top: 6px; }
.btn {
  flex: 1; padding: 13px; border-radius: 13px; font-size: 15px;
  font-weight: 700; cursor: pointer; border: none; font-family: var(--font);
  transition: opacity 0.13s; letter-spacing: -0.2px;
}
.btn:active { opacity: 0.72; }
.btn.primary   { background: var(--orange); color: #fff; }
.btn.secondary { background: var(--bg2); border: 1px solid var(--border2); color: var(--text); }
.btn.danger    { background: var(--red); color: #fff; }
.hidden { display: none !important; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 28px; right: 18px; z-index: 150;
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--orange); color: #fff;
  font-size: 28px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(212,87,10,0.38);
  cursor: pointer; border: none; font-family: var(--font);
  transition: transform 0.14s, box-shadow 0.14s;
}
.fab:active { transform: scale(0.90); box-shadow: 0 2px 8px rgba(212,87,10,0.22); }

.empty { text-align: center; padding: 56px 28px; color: var(--text-muted); font-size: 14px; }
.eico  { font-size: 46px; margin-bottom: 10px; opacity: 0.4; }

/* rule edit rows */
.rule-row {
  margin: 0 12px 5px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 10px 13px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; box-shadow: var(--shadow-sm);
}
.rule-row:active { background: var(--bg2); }
.rule-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; flex-shrink: 0;
}
.rule-dot.income   { background: var(--green); }
.rule-dot.credit   { background: var(--red); }
.rule-dot.spending { background: var(--yellow); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="topbar-title">💰 Balance</div>
      <div class="topbar-sub" id="topbar-sub">Loading…</div>
    </div>
    <div style="text-align:right">
      <div class="hero-label">Today's Balance</div>
      <div class="hero-bal pos" id="hero-bal">—</div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <button class="tab active" id="tab-all"      onclick="switchTab('all')">All <span class="badge" id="bdg-all">—</span></button>
  <button class="tab"        id="tab-cash"     onclick="switchTab('cash')">💵 Cash</button>
  <button class="tab"        id="tab-income"   onclick="switchTab('income')">📈 Income <span class="badge" id="bdg-income">—</span></button>
  <button class="tab"        id="tab-credit"   onclick="switchTab('credit')">💳 Cards <span class="badge" id="bdg-credit">—</span></button>
  <button class="tab"        id="tab-spending" onclick="switchTab('spending')">🏠 Regular <span class="badge" id="bdg-spending">—</span></button>
  <button class="tab"        id="tab-rules"    onclick="switchTab('rules')">⚙️ Rules</button>
</div>

<!-- FILTER CHIPS -->
<div class="filter-row" id="filter-row">
  <div class="chip active" onclick="setOwner('all',this)">All</div>
  <div class="chip"        onclick="setOwner('Justin',this)">Justin</div>
  <div class="chip"        onclick="setOwner('EJ',this)">EJ</div>
</div>

<!-- CONTENT -->
<div class="content" id="content"></div>

<!-- FAB -->
<button class="fab" id="fab-btn" onclick="fabAction()">＋</button>

<!-- ══ MODAL: ADD/EDIT ONE-OFF or RULE ══ -->
<div class="modal-overlay" id="modal-main" onclick="bgClose(event,'modal-main')">
<div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="modal-main-title">Add Event</div>

  <label>Name</label>
  <input type="text"   id="f-name"   placeholder="e.g. Chase Sapphire">

  <label>Type</label>
  <select id="f-type" onchange="typeChanged()">
    <option value="income">💵 Income</option>
    <option value="credit">💳 Credit Card</option>
    <option value="spending">🏠 Regular Spending</option>
  </select>

  <label>Owner</label>
  <select id="f-owner">
    <option value="Justin">Justin</option>
    <option value="EJ">EJ</option>
    <option value="Joint">Joint</option>
  </select>

  <!-- ONE-OFF fields -->
  <div id="f-onetime-section">
    <div class="modal-divider"></div>
    <div class="modal-section">One-time Event</div>
    <label>Date</label>
    <input type="date" id="f-date">
    <label>Amount ($)</label>
    <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0">
    <label>Last 4–5 Digits (cards)</label>
    <input type="text"   id="f-last4" placeholder="optional" maxlength="5">
    <label>Notes</label>
    <input type="text"   id="f-notes" placeholder="optional">
  </div>

  <div class="modal-btns">
    <button class="btn secondary" onclick="closeModal('modal-main')">Cancel</button>
    <button class="btn danger hidden" id="btn-del-event" onclick="deleteOneOff()">Delete</button>
    <button class="btn primary" onclick="saveOneOff()">Save</button>
  </div>
</div>
</div>

<!-- ══ MODAL: CONFIRM CC AMOUNT ══ -->
<div class="modal-overlay" id="modal-cc" onclick="bgClose(event,'modal-cc')">
<div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="modal-cc-title">Enter Statement Amount</div>
  <div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;" id="modal-cc-sub"></div>
  <label>Statement Amount ($) — leave 0 if no balance due</label>
  <input type="number" id="cc-amount" placeholder="0.00" step="0.01" min="0">
  <div class="modal-btns">
    <button class="btn secondary" onclick="closeModal('modal-cc')">Cancel</button>
    <button class="btn danger" onclick="clearCCAmount()">Clear (Pending)</button>
    <button class="btn primary" onclick="saveCCAmount()">Confirm</button>
  </div>
</div>
</div>

<!-- ══ MODAL: EDIT RULE ══ -->
<div class="modal-overlay" id="modal-rule" onclick="bgClose(event,'modal-rule')">
<div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="modal-rule-title">Edit Rule</div>

  <label>Name</label>
  <input type="text"   id="r-name" placeholder="Rule name">
  <label>Owner</label>
  <select id="r-owner">
    <option value="Justin">Justin</option>
    <option value="EJ">EJ</option>
    <option value="Joint">Joint</option>
  </select>
  <label>Amount ($)</label>
  <input type="number" id="r-amount" placeholder="0.00" step="0.01" min="0">

  <!-- frequency-specific -->
  <div id="r-monthly-section">
    <label>Day of Month</label>
    <input type="number" id="r-day" placeholder="1–31" min="1" max="31">
  </div>
  <div id="r-biweekly-section" class="hidden">
    <label>Next Occurrence (YYYY-MM-DD)</label>
    <input type="date" id="r-startdate">
  </div>
  <div id="r-cc-section" class="hidden">
    <label>Auto-pay Day of Month</label>
    <input type="number" id="r-cc-day" placeholder="1–31" min="1" max="31">

function connectScript() {
  const input = document.getElementById('setup-url');
  const url   = (input ? input.value : '').trim();
  if (!url.startsWith('https://script.google.com')) {
    alert('Please paste a valid Apps Script URL\n(starts with https://script.google.com)');
    return;
  }
  _scriptUrl = url;
  localStorage.setItem(SCRIPT_KEY, url);
  loadFromSheet();
}

// ── LOAD from Apps Script ─────────────────────────────
function loadFromSheet() {
  document.getElementById('topbar-sub').textContent = 'Loading…';

  const controller = new AbortController();
  const timeout    = setTimeout(() => controller.abort(), 10000);

  fetch(_scriptUrl + '?action=load', { signal: controller.signal })
    .then(r => { clearTimeout(timeout); return r.json(); })
    .then(res => {
      if (res.ok && res.data) {
        try   { S = JSON.parse(res.data); }
        catch (e) { S = defaultState(); }
      } else {
        // Reachable but empty — first use, keep defaults
        S = defaultState();
      }
      render();
    })
    .catch(err => {
      clearTimeout(timeout);
      console.warn('Sheet load failed:', err.message);
      // Try localStorage cache
      try {
        const cached = localStorage.getItem(SK);
        if (cached) { S = JSON.parse(cached); render(); return; }
      } catch(e) {}
      // Nothing available — clear bad URL and show setup screen again
      _scriptUrl = '';
      localStorage.removeItem(SCRIPT_KEY);
      alert('Could not connect to your Apps Script URL.\nPlease check the URL and try again.');
      showSetupScreen();
    });
}

// ── SAVE to Apps Script (debounced 800ms) ─────────────
function save() {
  // Cache locally for instant offline fallback
  try { localStorage.setItem(SK, JSON.stringify(S)); } catch(e) {}

  if (!_scriptUrl) return;
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    fetch(_scriptUrl, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify({ action: 'save', data: JSON.stringify(S) })
    })
    .then(r => r.json())
    .then(res => { if (!res.ok) console.warn('Save error:', res.error); })
    .catch(err  => console.warn('Save failed:', err.message));
  }, 800);
}

// ── RECONNECT (from Rules tab) ────────────────────────
function resetScriptUrl() {
  if (!confirm('Disconnect from Google Sheet and re-enter the Apps Script URL?')) return;
  localStorage.removeItem(SCRIPT_KEY);
  _scriptUrl = '';
  showSetupScreen();
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
const $  = id => document.getElementById(id);
const $$ = s  => document.querySelectorAll(s);

function fmt(n) {
  const a = Math.abs(n);
  return (n < 0 ? '-' : '') + '$' + a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(s, d) {
  const dt = new Date(s+'T12:00:00'); dt.setDate(dt.getDate()+d);
  return dt.toISOString().slice(0,10);
}
function fmtDate(s)      { return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(s) { return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function monthKey(s)     { return s.slice(0,7); } // "2026-05"
function fmtMonth(k)     { const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

function makeDate(year, month, day) {
  // clamp day to last day of month
  const last = new Date(year, month, 0).getDate();
  const d = Math.min(day, last);
  return `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function typeIcon(t)  { return {income:'💵', credit:'💳', spending:'🏠'}[t] || '📌'; }
function typeLabel(t) { return {income:'Income', credit:'Credit', spending:'Regular'}[t] || t; }
function freqLabel(r) {
  if (r.freq === 'biweekly')       return 'Every 14 days';
  if (r.freq === 'monthly')        return `Monthly (day ${r.day})`;
  if (r.freq === 'credit-monthly') return `Auto-pay day ${r.day}`;
  return r.freq;
}

// ═══════════════════════════════════════════════════════
//  STARTING BALANCE (from cash accounts)
// ═══════════════════════════════════════════════════════
function getStartingBalance(owner) {
  const c = S.cash;
  // Justin Checking → owner: Justin
  // EJ Checking     → owner: EJ
  // Physical Cash   → owner: Joint (included in All, Justin, and EJ)
  let amount, dates;
  if (!owner || owner === 'all') {
    amount = c.justin.amount + c.ej.amount + c.physical.amount;
    dates  = [c.justin.asof, c.ej.asof, c.physical.asof];
  } else if (owner === 'Justin') {
    amount = c.justin.amount;
    dates  = [c.justin.asof];
  } else { // EJ
    amount = c.ej.amount;
    dates  = [c.ej.asof];
  }
  const asof = [...dates].sort().pop();
  return { amount, asof };
}

// ═══════════════════════════════════════════════════════
//  TIMELINE EXPANSION
//  Generates events from rules + oneoffs within [startDate, endDate]
// ═══════════════════════════════════════════════════════
function expandTimeline(windowStart, windowEnd, owner) {
  // owner: 'all' | 'Justin' | 'EJ' — filters events by owner
  const ownerMatch = (evOwner) => {
    if (!owner || owner === 'all') return true;
    return evOwner === owner || evOwner === 'Joint';
  };

  const events = [];

  for (const rule of S.rules) {
    if (!ownerMatch(rule.owner)) continue;
    if (rule.endDate && rule.endDate < windowStart) continue;

    if (rule.freq === 'biweekly') {
      let cur = rule.startDate;
      while (cur < windowStart) cur = addDays(cur, 14);
      while (cur <= windowEnd) {
        if (!rule.endDate || cur <= rule.endDate) {
          events.push({
            id: rule.id + '-' + cur, ruleId: rule.id,
            type: rule.type, name: rule.name, owner: rule.owner,
            date: cur, amount: rule.amount, last4: rule.last4 || '',
            notes: rule.notes || '', isPending: false, isRecurring: true
          });
        }
        cur = addDays(cur, 14);
      }

    } else if (rule.freq === 'monthly') {
      let year = new Date(windowStart+'T12:00:00').getFullYear();
      let month = new Date(windowStart+'T12:00:00').getMonth() + 1;
      while (true) {
        const dateStr = makeDate(year, month, rule.day);
        if (dateStr > windowEnd) break;
        if (dateStr >= windowStart && (!rule.endDate || dateStr <= rule.endDate)) {
          events.push({
            id: rule.id + '-' + dateStr, ruleId: rule.id,
            type: rule.type, name: rule.name, owner: rule.owner,
            date: dateStr, amount: rule.amount, last4: rule.last4 || '',
            notes: rule.notes || '', isPending: false, isRecurring: true
          });
        }
        month++; if (month > 12) { month = 1; year++; }
        if (year > 2040) break;
      }

    } else if (rule.freq === 'credit-monthly') {
      let year = new Date(windowStart+'T12:00:00').getFullYear();
      let month = new Date(windowStart+'T12:00:00').getMonth() + 1;
      while (true) {
        const dateStr = makeDate(year, month, rule.day);
        if (dateStr > windowEnd) break;
        if (dateStr >= windowStart && (!rule.endDate || dateStr <= rule.endDate)) {
          const mk        = monthKey(dateStr);
          const confirmed = S.confirmedAmounts[rule.id];
          const raw       = confirmed ? confirmed[mk] : undefined;
          // pending = null/undefined → isPending true, amount 0 (treated as $0 in projection)
          const isPending = (raw === undefined || raw === null);
          const amt       = isPending ? 0 : raw;
          events.push({
            id: rule.id + '-' + mk, ruleId: rule.id, monthKey: mk,
            type: 'credit', name: rule.name, owner: rule.owner,
            date: dateStr, amount: amt,
            last4: rule.last4 || '', notes: '', isPending, isRecurring: true
          });
        }
        month++; if (month > 12) { month = 1; year++; }
        if (year > 2040) break;
      }
    }
  }

  // Add one-offs within window
  for (const ev of S.oneoffs) {
    if (!ownerMatch(ev.owner)) continue;
    if (ev.date >= windowStart && ev.date <= windowEnd) {
      events.push({ ...ev, isRecurring: false, isPending: false });
    }
  }

  events.sort((a,b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));

  // Compute running balance anchored to owner-specific starting balance
  const { amount: startBal } = getStartingBalance(owner);
  let bal = startBal;
  return events.map(ev => {
    bal += (ev.type === 'income' ? 1 : -1) * ev.amount;
    return { ...ev, balAfter: bal };
  });
}

function currentBal(tl, owner) {
  const t = todayStr();
  const { amount } = getStartingBalance(owner);
  let b = amount;
  for (const ev of tl) if (ev.date <= t) b = ev.balAfter;
  return b;
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render() {
  // Owner-specific starting balance and timeline
  const { amount: startBal, asof: startDate } = getStartingBalance(ownerFilter);
  const today  = todayStr();
  const winEnd = addDays(today, 30);
  const tl     = expandTimeline(startDate, winEnd, ownerFilter);
  const bal    = currentBal(tl, ownerFilter);

  // Hero — always shows the owner-filtered balance
  const hb = $('hero-bal');
  hb.textContent = fmt(bal);
  hb.className   = 'hero-bal ' + (bal >= 0 ? 'pos' : 'neg');
  $('topbar-sub').textContent = (ownerFilter !== 'all' ? ownerFilter + ' · ' : '') + 'Today · ' + fmtDate(today);

  // Badges (always use full 'all' timeline for counts)
  const { asof: allStart } = getStartingBalance('all');
  const allEvs = expandTimeline(allStart, winEnd, 'all');
  $('bdg-all').textContent     = allEvs.length;
  $('bdg-income').textContent  = allEvs.filter(e=>e.type==='income').length;
  $('bdg-credit').textContent  = allEvs.filter(e=>e.type==='credit').length;
  $('bdg-spending').textContent= allEvs.filter(e=>e.type==='spending').length;

  $$('.tab').forEach(t => t.classList.remove('active'));
  $('tab-' + currentTab).classList.add('active');

  // Filter row visibility
  $('filter-row').style.display = (currentTab==='all'||currentTab==='credit'||currentTab==='income'||currentTab==='spending') ? '' : 'none';

  const cont = $('content');
  if (currentTab === 'cash')    { renderCash(cont, startBal, startDate); return; }
  if (currentTab === 'income')  { renderIncome(cont, tl);   return; }
  if (currentTab === 'credit')  { renderCredit(cont, tl);   return; }
  if (currentTab === 'spending'){ renderSpending(cont, tl); return; }
  if (currentTab === 'rules')   { renderRules(cont);        return; }
  renderAll(cont, tl, today, startBal, startDate, winEnd);
}

// ── ALL ──────────────────────────────────────────────────────────────────────
function renderAll(cont, tl, today, startBal, startDate, winEnd) {
  // tl is already owner-filtered and anchored to owner-specific starting balance
  const inc    = tl.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const out    = tl.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0);
  const endBal = tl.length ? tl[tl.length-1].balAfter : startBal;
  const endDate = winEnd; // 30 days from today

  let html = '';

// ── CURRENT CYCLE HELPER ─────────────────────────────────────────────────────
// For a credit-monthly rule, returns { monthKey, date, state, amount }
// state: 'pending' | 'zero' | 'confirmed'
function currentCycleInfo(rule) {
  const today = todayStr();
  const [y, m] = today.split('-').map(Number);

  // If today is before the autopay day this month → current cycle = this month
  // If today is on/after the autopay day → current cycle = next month
  let cycleYear = y, cycleMonth = m;
  const autopayThisMonth = makeDate(y, m, rule.day);
  if (today >= autopayThisMonth) {
    cycleMonth++;
    if (cycleMonth > 12) { cycleMonth = 1; cycleYear++; }
  }

  const mk   = `${cycleYear}-${String(cycleMonth).padStart(2,'0')}`;
  const date = makeDate(cycleYear, cycleMonth, rule.day);

  const confirmed = S.confirmedAmounts[rule.id];
  const raw = confirmed ? confirmed[mk] : undefined;

  let state, amount;
  if (raw === undefined || raw === null) {
    state = 'pending'; amount = 0;
  } else if (raw === 0) {
    state = 'zero';    amount = 0;
  } else {
    state = 'confirmed'; amount = raw;
  }

  return { mk, date, state, amount };
}

// ── CREDIT CARDS ─────────────────────────────────────────────────────────────
function renderCredit(cont, tl) {
  const today = todayStr();

  // Get all credit-monthly rules, optionally filtered by owner
  let rules = S.rules.filter(r => r.freq === 'credit-monthly');
  if (ownerFilter !== 'all') {
    rules = rules.filter(r => r.owner === ownerFilter || r.owner === 'Joint');
  }

  // Summary counts
  const cycles      = rules.map(r => ({ rule: r, cycle: currentCycleInfo(r) }));
  const nPending    = cycles.filter(c => c.cycle.state === 'pending').length;
  const nZero       = cycles.filter(c => c.cycle.state === 'zero').length;
  const nConfirmed  = cycles.filter(c => c.cycle.state === 'confirmed').length;
  const totalOut    = cycles.filter(c => c.cycle.state === 'confirmed').reduce((s,c) => s + c.cycle.amount, 0);

  let html = `
    <div class="summary-bar" style="margin-top:10px">
      <div class="sc"><div class="sc-lbl">Cards</div><div class="sc-val org">${rules.length}</div></div>
      <div class="sc"><div class="sc-lbl">Pending</div><div class="sc-val org">${nPending}</div></div>
      <div class="sc"><div class="sc-lbl">$0 Confirmed</div><div class="sc-val" style="color:var(--text-muted)">${nZero}</div></div>
      <div class="sc"><div class="sc-lbl">Confirmed Out</div><div class="sc-val neg">${fmt(totalOut)}</div></div>
    </div>
  `;

  // Group by autopay date for section headers (optional visual grouping)
  // Sort: pending first, then confirmed, then zero — within each group by date
  const sorted = [...cycles].sort((a, b) => {
    const order = { pending: 0, confirmed: 1, zero: 2 };
    const od = order[a.cycle.state] - order[b.cycle.state];
    if (od !== 0) return od;
    return a.cycle.date.localeCompare(b.cycle.date);
  });

  // Pending section
  const pendingItems   = sorted.filter(c => c.cycle.state === 'pending');
  const confirmedItems = sorted.filter(c => c.cycle.state === 'confirmed');
  const zeroItems      = sorted.filter(c => c.cycle.state === 'zero');

  function cardHTML({ rule, cycle }) {
    const { mk, date, state, amount } = cycle;
    const isExpired = rule.endDate && today > rule.endDate;

    let amtBlock;
    if (state === 'pending') {
      amtBlock = `<div class="cc-amt-pending">Pending — tap to enter ✎</div>`;
    } else if (state === 'zero') {
      amtBlock = `<div style="font-size:13px;font-weight:600;color:var(--text-muted)">$0.00 confirmed</div>`;
    } else {
      amtBlock = `<div class="cc-amt-confirmed">${fmt(amount)}</div>`;
    }

    return `
      <div class="cc-card${state==='zero'?' dim-card':''}"
           onclick="openCCModal('${rule.id}','${mk}')">
        <div class="cc-card-hdr">
          <div class="cc-card-name">💳 ${rule.name}${rule.last4?' ···'+rule.last4:''}</div>
          <span class="owner-badge ${rule.owner}">${rule.owner}</span>
        </div>
        <div class="cc-card-body">
          <div>
            <div class="cc-date-lbl">Auto-pay: ${fmtDate(date)}</div>
            <div style="font-size:10px;color:var(--text-faint);margin-top:3px">${fmtMonth(mk)} cycle</div>
            ${rule.endDate ? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px">ends ${fmtDate(rule.endDate)}</div>` : ''}
          </div>
          <div style="text-align:right">
            ${amtBlock}
          </div>
        </div>
      </div>
    `;
  }

  if (pendingItems.length) {
    html += `<div class="section-lbl">🟠 Pending (${pendingItems.length}) — tap to enter statement</div>`;
    pendingItems.forEach(c => html += cardHTML(c));
  }
  if (confirmedItems.length) {
    html += `<div class="section-lbl">✅ Confirmed (${confirmedItems.length})</div>`;
    confirmedItems.forEach(c => html += cardHTML(c));
  }
  if (zeroItems.length) {
    html += `<div class="section-lbl">⬜ $0 Balance (${zeroItems.length})</div>`;
    zeroItems.forEach(c => html += cardHTML(c));
  }

  if (!rules.length) html += `<div class="empty"><div class="eico">💳</div>No credit card rules found</div>`;
  cont.innerHTML = html;
}

}
function openEditOneOff(evId, ruleId) {
  // If it's a pure recurring event (no custom override), just open rule editor
  if (ruleId && !evId.startsWith('ev')) {
    openEditRule(ruleId); return;
  }
  const ev = S.oneoffs.find(e=>e.id===evId);
  if (!ev) return;
  _editingId = evId;
  $('modal-main-title').textContent = 'Edit Event';
  $('f-name').value=ev.name; $('f-date').value=ev.date; $('f-amount').value=ev.amount;
  $('f-type').value=ev.type; $('f-owner').value=ev.owner;
  $('f-last4').value=ev.last4||''; $('f-notes').value=ev.notes||'';
  $('btn-del-event').classList.remove('hidden');
  $('f-onetime-section').classList.remove('hidden');
  openModal('modal-main');
}
function saveOneOff() {
  const name=($('f-name').value||'').trim(), date=$('f-date').value;
  if (!name||!date){alert('Name and date required.');return;}
  const ev = {
    id: _editingId || 'ev'+(++_nid),
    name, date,
    amount: parseFloat($('f-amount').value)||0,
    type:   $('f-type').value,
    owner:  $('f-owner').value,
    last4:  ($('f-last4').value||'').trim(),
    notes:  ($('f-notes').value||'').trim()
  };
  if (_editingId) {
    const idx = S.oneoffs.findIndex(e=>e.id===_editingId);
    if (idx>=0) S.oneoffs[idx]=ev; else S.oneoffs.push(ev);
  } else {
    S.oneoffs.push(ev);
  }
  save(); closeModal('modal-main'); render();
}
function deleteOneOff() {
  if (!_editingId||!confirm('Delete this event?')) return;
  S.oneoffs = S.oneoffs.filter(e=>e.id!==_editingId);
  save(); closeModal('modal-main'); render();
}

// ── CC AMOUNT MODAL ──────────────────────────────────
function openCCModal(ruleId, mk) {
  _ccEditKey = { ruleId, mk };
  const rule  = S.rules.find(r => r.id === ruleId);
  const cycle = rule ? currentCycleInfo(rule) : null;
  // Use passed mk, but default to current cycle if not provided
  const useMk   = mk || (cycle ? cycle.mk : '');
  _ccEditKey    = { ruleId, mk: useMk };

  $('modal-cc-title').textContent = (rule ? rule.name + (rule.last4 ? ' ···' + rule.last4 : '') : 'Card') +
    ' — ' + fmtMonth(useMk);

  const autopayDate = rule ? makeDate(...useMk.split('-').map(Number).concat([rule.day])) : '';
  $('modal-cc-sub').textContent = autopayDate
    ? `Auto-pay on ${fmtDate(autopayDate)}. Enter the statement balance that will be paid.`
    : '';

  const cur = S.confirmedAmounts[ruleId] && S.confirmedAmounts[ruleId][useMk];
  $('cc-amount').value = (cur != null && cur !== null) ? cur : '';
  openModal('modal-cc');
}
function saveCCAmount() {
  if (!_ccEditKey) return;
  const {ruleId, mk} = _ccEditKey;
  const amt = parseFloat($('cc-amount').value) || 0;
  if (!S.confirmedAmounts[ruleId]) S.confirmedAmounts[ruleId] = {};
  S.confirmedAmounts[ruleId][mk] = amt;
  save(); closeModal('modal-cc'); render();
}
function clearCCAmount() {
  if (!_ccEditKey) return;
  const {ruleId, mk} = _ccEditKey;
  if (!S.confirmedAmounts[ruleId]) S.confirmedAmounts[ruleId] = {};
  S.confirmedAmounts[ruleId][mk] = null;
  save(); closeModal('modal-cc'); render();
}

  $('r-biweekly-section').classList.add('hidden');
  $('r-cc-section').classList.add('hidden');
  $('btn-del-rule').classList.add('hidden');
  openModal('modal-rule');
}
function openEditRule(ruleId) {
  const rule = S.rules.find(r=>r.id===ruleId); if (!rule) return;
  _editingRuleId = ruleId;
  $('modal-rule-title').textContent = 'Edit Rule';
  $('r-name').value   = rule.name;
  $('r-owner').value  = rule.owner;
  $('r-amount').value = rule.amount || '';
  $('r-enddate').value= rule.endDate || '';

  $('r-monthly-section').classList.toggle('hidden',  rule.freq==='biweekly'||rule.freq==='credit-monthly');
  $('r-biweekly-section').classList.toggle('hidden', rule.freq!=='biweekly');
  $('r-cc-section').classList.toggle('hidden',       rule.freq!=='credit-monthly');

  if (rule.freq==='monthly')        $('r-day').value      = rule.day||'';
  if (rule.freq==='biweekly')       $('r-startdate').value = rule.startDate||'';
  if (rule.freq==='credit-monthly') { $('r-cc-day').value = rule.day||''; $('r-last4').value = rule.last4||''; }

  $('btn-del-rule').classList.remove('hidden');
  openModal('modal-rule');
}
function saveRule() {
  if (!_editingRuleId) { closeModal('modal-rule'); return; } // add rule flow TBD
  const idx = S.rules.findIndex(r=>r.id===_editingRuleId); if (idx<0) return;
  const rule = S.rules[idx];
  rule.name    = ($('r-name').value||'').trim() || rule.name;
  rule.owner   = $('r-owner').value;
  rule.endDate = $('r-enddate').value || null;
  if (rule.freq==='biweekly')       { rule.amount = parseFloat($('r-amount').value)||rule.amount; rule.startDate = $('r-startdate').value||rule.startDate; }
  if (rule.freq==='monthly')        { rule.amount = parseFloat($('r-amount').value)||rule.amount; rule.day = parseInt($('r-day').value)||rule.day; }
  if (rule.freq==='credit-monthly') { rule.day = parseInt($('r-cc-day').value)||rule.day; rule.last4 = ($('r-last4').value||'').trim(); }
  save(); closeModal('modal-rule'); render();
}
function deleteRule() {
  if (!_editingRuleId||!confirm('Delete this rule? All future occurrences will be removed.')) return;
  S.rules = S.rules.filter(r=>r.id!==_editingRuleId);
  save(); closeModal('modal-rule'); render();
}

// ── CASH MODAL ───────────────────────────────────────
function openCashModal(field) {
  _cashField = field;
  const label = {justin:'Justin Checking', ej:'EJ Checking', physical:'Physical Cash'}[field];
  $('modal-cash-label').textContent = label;
  $('cash-amount').value = S.cash[field].amount;
  $('cash-asof').value   = S.cash[field].asof;
  openModal('modal-cash');
}
function saveCash() {
  if (!_cashField) return;
  const amt  = parseFloat($('cash-amount').value) || 0;
  const asof = $('cash-asof').value || todayStr();
  S.cash[_cashField] = { amount: amt, asof };
  save(); closeModal('modal-cash'); render();
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
initApp();
</script>
